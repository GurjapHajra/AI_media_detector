<h1>To View all features please login</h1>
<div class="search">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Asset Name</mat-label>
    <input
      matInput
      type="text"
      [(ngModel)]="filter"
      (keydown.enter)="searched()"
    />
  </mat-form-field>
  <button mat-flat-button (click)="searched()">Search</button>
</div>

<ng-container *ngIf="(searchResult | async)?.length">
  <table mat-table [dataSource]="searchResult">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell color="primary" *matCellDef="let element">
        {{ element.name }}
      </td>
    </ng-container>

    <!-- verify Column -->
    <ng-container matColumnDef="view">
      <th mat-header-cell *matHeaderCellDef>View</th>
      <td mat-cell *matCellDef="let element" (click)="openImage(element.name)">
        <button mat-flat-button color="primary">view</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</ng-container>

<ng-container *ngIf="picUrl">
  <img [src]="picUrl" alt="Image" />
</ng-container>
