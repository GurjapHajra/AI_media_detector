<h1>Media Finder by Name</h1>
<div class="search">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Asset Name</mat-label>
    <input matInput type="text" [(ngModel)]="filter" (keydown.enter)="searched()">
  </mat-form-field>
  <button mat-flat-button (click)="searched()">Search</button>
</div>

<ng-container *ngIf="(searchResult | async)?.length">
  <table mat-table [dataSource]="searchResult">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell color="primary" *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Size Column -->
    <ng-container matColumnDef="size">
      <th mat-header-cell *matHeaderCellDef> Size</th>
      <td mat-cell *matCellDef="let element"> {{element.size}} KB</td>
    </ng-container>

    <!-- Last Modified Column -->
    <ng-container matColumnDef="LastModified">
      <th mat-header-cell *matHeaderCellDef> Last Modified </th>
      <td mat-cell *matCellDef="let element"> {{element.LastModified}} </td>
    </ng-container>

    <!-- verify Column -->
    <ng-container matColumnDef="view">
      <th mat-header-cell *matHeaderCellDef> View </th>
      <td mat-cell *matCellDef="let element" (click)="openImage(element.name)">
        <button mat-flat-button color="primary">
          view
        </button>
      </td>
    </ng-container>

    <!-- verify Column -->
    <ng-container matColumnDef="verify">
      <th mat-header-cell *matHeaderCellDef> Verify </th>
      <td mat-cell *matCellDef="let element" (click)="verify(element.name)">
        <button mat-flat-button color="primary">
          verify
        </button>
      </td>
    </ng-container>

    <!-- verify Column -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef> Delete </th>
      <td mat-cell *matCellDef="let element" (click)="deleteMedia(element.name)">
        <button mat-flat-button color="primary">
          Delete
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</ng-container>

<ng-container *ngIf="picUrl">
  <img [src]="picUrl" alt="Image" />
  <button mat-flat-button class="download_button" (click)="download()"> download </button>
</ng-container>
