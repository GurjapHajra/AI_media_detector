<div class="search">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Asset Name</mat-label>
    <input matInput (keydown.enter)="searched()">
  </mat-form-field>
  <button mat-flat-button (click)="searched()">Search</button>
</div>

<ng-container *ngIf="(searchResult | async)?.length">
  <table mat-table [dataSource]="searchResult">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell class="clickable" *matCellDef="let element" (click)="openImage(element.name)"> {{element.name}} </td>
    </ng-container>

    <!-- Size Column -->
    <ng-container matColumnDef="size">
      <th mat-header-cell *matHeaderCellDef> Size</th>
      <td mat-cell *matCellDef="let element"> {{element.size}} KB</td>
    </ng-container>

    <!-- Last Modified Column -->
    <ng-container matColumnDef="LastModified">
      <th mat-header-cell *matHeaderCellDef> Last Modified </th>
      <td mat-cell *matCellDef="let element"> {{element.LastModified}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</ng-container>

<ng-container *ngIf="picUrl">
  <img [src]="picUrl" alt="Image" />
</ng-container>
