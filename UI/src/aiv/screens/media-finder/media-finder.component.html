<h1>Media Finder</h1>
<div class="search" [class.loading]="loading">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Asset Name</mat-label>
    <input matInput type="text" [(ngModel)]="filter" (keydown.enter)="searched()" />
  </mat-form-field>
  <button mat-flat-button (click)="searched()">Search</button>
</div>

<!-- Loading Spinner for Search -->
<div *ngIf="loading" class="loading-spinner">
  <mat-spinner></mat-spinner>
</div>

<!-- Table Data -->
<ng-container *ngIf="!loading && (searchResult | async)?.length">
  <table mat-table [dataSource]="searchResult">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell color="primary" *matCellDef="let asset">
        {{ asset.name }}
      </td>
    </ng-container>

    <!-- Size Column -->
    <ng-container matColumnDef="size">
      <th mat-header-cell *matHeaderCellDef>Size</th>
      <td mat-cell *matCellDef="let asset">{{ asset.size }} KB</td>
    </ng-container>

    <!-- Last Modified Column -->
    <ng-container matColumnDef="LastModified">
      <th mat-header-cell *matHeaderCellDef>Last Modified</th>
      <td mat-cell *matCellDef="let asset">{{ asset.LastModified }}</td>
    </ng-container>

    <!-- View Column -->
    <ng-container matColumnDef="view">
      <th mat-header-cell *matHeaderCellDef>View</th>
      <td mat-cell *matCellDef="let element">
        <button mat-flat-button color="primary" (click)="openImage(element.name)"
          [disabled]="viewLoading[element.name]">
          <span *ngIf="viewLoading[element.name]">
            <mat-spinner diameter="20"></mat-spinner>
          </span>
          <span *ngIf="!viewLoading[element.name]">view</span>
        </button>
      </td>
    </ng-container>

    <!-- Verify Column -->
    <ng-container matColumnDef="verify">
      <th mat-header-cell *matHeaderCellDef>Verify</th>
      <td mat-cell *matCellDef="let asset">
        <button *ngIf="!asset.verified" mat-flat-button color="primary" (click)="verify(asset)"
          [disabled]="(verifyLoading[asset.name] || asset.verified)">
          <span *ngIf="verifyLoading[asset.name]">
            <mat-spinner diameter="20"></mat-spinner>
          </span>
          <span *ngIf="(!verifyLoading[asset.name])">{{ 'verify' }}</span>
        </button>
        <div *ngIf="(!verifyLoading[asset.name] && asset.verified)" class="verify_icon">
          <mat-icon>
            verified
          </mat-icon>
        </div>
      </td>
    </ng-container>

    <!-- Delete Column -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>Delete</th>
      <td mat-cell *matCellDef="let asset">
        <button mat-flat-button color="primary" (click)="deleteMedia(asset.name)"
          [disabled]="(deleteLoading | async)?.status">
          <span *ngIf="(deleteLoading | async)?.name == asset.name">
            <mat-spinner diameter="20"></mat-spinner>
          </span>
          <span *ngIf="!((deleteLoading | async)?.name == asset.name)">Delete</span>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let asset; columns: displayedColumns"></tr>
  </table>
</ng-container>

<ng-container *ngIf="picUrl">
  <img [src]="picUrl" alt="Image" />
  <div class="row">
    <button mat-flat-button class="download_button" (click)="download()">
      Download
    </button>
    <button mat-flat-button class="download_button" (click)="clearImage()">
      Clear
    </button>
    <button *ngIf="getAssetIsVerified() | async" mat-flat-button class="download_button" (click)="viewVerify()">
      view verified
    </button>
  </div>
</ng-container>
