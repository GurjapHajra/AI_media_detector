<h1>Report</h1>
<mat-card>
  <form [formGroup]="reportForm" (submit)="sendEmail($event)">
    <mat-form-field>
      <mat-label>name</mat-label>
      <input matInput placeholder="name" formControlName="name" required />
      <mat-error>Name is required</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>email</mat-label>
      <input matInput type="email" placeholder="email" formControlName="email" required />
      <mat-error>email incorrect</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>message</mat-label>
      <textarea matInput placeholder="message" formControlName="message" required>
      </textarea>
      <mat-error>message is required</mat-error>
    </mat-form-field>

    <button [disabled]="!this.reportForm.valid" mat-flat-button type="submit" color="primary">Send</button>
  </form>
</mat-card>
