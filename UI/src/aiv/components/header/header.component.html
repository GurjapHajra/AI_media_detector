<ng-template [ngIf]="(loggedIn | async)">
  <div class="full-height">
    <img src="../../../assets/mainLogoClear.png" (click)="GoToHome()" />
  </div>

  <button mat-flat-button color="primary" (click)="GoToSeach()">
    <mat-icon>search</mat-icon>
  </button>
  <div class="header-links">
    <button mat-flat-button color="primary" (click)="createAccount()">
      <mat-icon>person_add</mat-icon>
    </button>

    <button mat-flat-button color="primary" (click)="signout.emit()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</ng-template>

<ng-template [ngIf]="!(loggedIn | async)">
  <div class="full-height">
    <img src="../../../assets/mainLogoClear.png" (click)="GoToSeach()" />
  </div>

  <div class="header-links">
    <button mat-flat-button color="primary" (click)="signin.emit()">
      <mat-icon>login</mat-icon>
    </button>
  </div>
</ng-template>
