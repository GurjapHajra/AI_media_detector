AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS_Media_Service

  Sample SAM Template for AWS_Media_Service

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 5
    MemorySize: 128

Resources:
  MediaServiceS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "media-service-${AWS::AccountId}-${AWS::Region}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
            AllowedOrigins:
              - "*"

  MediaServiceGetFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: media_service/
      Handler: service_handler.get_handler
      Runtime: python3.10
      Architectures:
        - x86_64
      Events:
        MyEvent:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /
            Method: get
      Policies:
        S3CrudPolicy:
          BucketName: !Ref MediaServiceS3Bucket

  MediaServiceDBGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: media_service/
      Handler: service_handler.db_get_handler
      Runtime: python3.10
      Architectures:
        - x86_64
      Events:
        MyEvent:
          Type: Api
          Properties:
            Path: /db
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MediaServiceDynamoDBTable

  MediaServicePostFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: media_service/
      Handler: service_handler.post_handler
      Runtime: python3.10
      Architectures:
        - x86_64
      Events:
        MyEvent:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /upload
            Method: post
      Policies:
        S3CrudPolicy:
          BucketName: !Ref MediaServiceS3Bucket

  MediaServiceDBFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: media_service/
      Handler: service_handler.db_handler
      Runtime: python3.10
      Architectures:
        - x86_64
      Events:
        MyEvent:
          Type: Api
          Properties:
            Path: /db
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MediaServiceDynamoDBTable
        - S3CrudPolicy:
            BucketName: !Ref MediaServiceS3Bucket

  MediaServiceDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MediaServiceAssets
      AttributeDefinitions:
        - AttributeName: asset_id
          AttributeType: S
        - AttributeName: asset_name
          AttributeType: S
        # - AttributeName: asset_type
        #   AttributeType: S
        # - AttributeName: verified
        #   AttributeType: B
        # - AttributeName: upvotes
        #   AttributeType: N
        # - AttributeName: downvotes
        #   AttributeType: N
        # - AttributeName: p_hash
        #   AttributeType: S
      KeySchema:
        - AttributeName: asset_id
          KeyType: HASH
        - AttributeName: asset_name
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  MediaServiceDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: media_service/
      Handler: service_handler.delete_handler
      Runtime: python3.10
      Architectures:
        - x86_64
      Events:
        MyEvent:
          Type: Api
          Properties:
            Path: /delete
            Method: delete
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MediaServiceS3Bucket
        - DynamoDBCrudPolicy:
            TableName: !Ref MediaServiceDynamoDBTable

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  MediaServiceApi:
    Description: "API Gateway endpoint URL for Prod stage for MediaService function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  MediaServiceGetFunction:
    Description: "Hello MediaServiceFunction Lambda Function ARN"
    Value: !GetAtt MediaServiceGetFunction.Arn
  MediaServicePostFunction:
    Description: "Hello MediaServiceFunction Lambda Function ARN"
    Value: !GetAtt MediaServicePostFunction.Arn
  MediaServiceS3Bucket:
    Description: "MediaServiceS3Bucket"
    Value: !Ref MediaServiceS3Bucket
  MediaServiceDynamoDBTable:
    Description: "MediaServiceDynamoDBTable"
    Value: !Ref MediaServiceDynamoDBTable
